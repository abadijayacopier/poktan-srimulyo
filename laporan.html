<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pusat Cetak Dokumen Laporan Resmi - Poktan Sri Mulyo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; color: black !important; padding: 0 !important; }
      .print-page { box-shadow: none !important; border: none !important; margin: 0 !important; padding: 0 !important; width: 100% !important; max-width: 100% !important; }
      .page-break { page-break-after: always; }
      table { border-collapse: collapse !important; }
      th, td { border-color: #333 !important; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-3 sm:p-6 lg:p-8 font-sans">

  <!-- Navigasi & Action Toolbar Atas (No-Print) -->
  <div class="max-w-6xl mx-auto mb-6 no-print space-y-4">
    <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <div class="flex items-center gap-2 mb-1">
          <span class="px-2.5 py-0.5 rounded-md bg-emerald-100 text-emerald-800 text-[10px] font-extrabold uppercase">DOKUMEN RESMI POKTAN</span>
          <span class="text-xs text-slate-400">Musim Tanam III 2026</span>
          <span id="sync-badge" class="px-2 py-0.5 rounded-md bg-blue-100 text-blue-700 text-[10px] font-semibold flex items-center gap-1">
            <i class="fa-solid fa-spinner fa-spin text-[9px]"></i> Menghubungkan Google Sheets...
          </span>
        </div>
        <h1 class="text-xl sm:text-2xl font-black text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-print text-emerald-600"></i>
          Pusat Cetak & Laporan Resmi
        </h1>
        <p class="text-xs text-slate-500 mt-0.5">Format cetak resmi sinkron otomatis dari 4 sheet utama Poktan Sri Mulyo</p>
      </div>

      <div class="flex flex-wrap items-center gap-2.5">
        <a href="index.html" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition flex items-center gap-1.5 border border-slate-200">
          <i class="fa-solid fa-arrow-left"></i> Dashboard Utama
        </a>
        <a href="cetak-kloter.html" class="px-4 py-2 rounded-xl bg-purple-700 hover:bg-purple-800 text-white text-xs font-bold transition flex items-center gap-1.5 shadow-sm active:scale-95">
          <i class="fa-solid fa-file-contract"></i> Cetak Kloter (F4)
        </a>
        <button onclick="sinkronUlangData()" id="btn-refresh" class="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition flex items-center gap-1.5 border border-slate-200">
          <i class="fa-solid fa-rotate text-emerald-600"></i> Segarkan Data
        </button>
        <button onclick="window.print()" class="px-4 py-2 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold transition flex items-center gap-1.5 shadow-sm active:scale-95">
          <i class="fa-solid fa-print"></i> Cetak Dokumen Terpilih
        </button>
      </div>
    </div>

    <!-- Pilihan Tab Dokumen Laporan Cetak -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
      <!-- 1. LAPORAN_CETAK -->
      <button onclick="pilihLaporan('laporan_cetak')" id="tab-laporan_cetak" 
              class="laporan-tab active-tab bg-white p-4 rounded-xl border-2 border-emerald-600 shadow-sm text-left transition group">
        <div class="flex items-center justify-between mb-1">
          <span class="w-8 h-8 rounded-lg bg-emerald-50 text-emerald-700 flex items-center justify-center text-sm font-bold">1</span>
          <i class="fa-solid fa-file-invoice text-emerald-600"></i>
        </div>
        <div class="text-xs font-bold text-slate-900">Laporan Penyaluran</div>
        <div class="text-[10px] text-slate-500">Sheet: LAPORAN_CETAK (4 Bagian)</div>
      </button>

      <!-- 2. REKAP_KLOTER_CETAK -->
      <button onclick="pilihLaporan('rekap_kloter')" id="tab-rekap_kloter" 
              class="laporan-tab bg-white p-4 rounded-xl border-2 border-slate-200 hover:border-slate-300 shadow-sm text-left transition group">
        <div class="flex items-center justify-between mb-1">
          <span class="w-8 h-8 rounded-lg bg-purple-50 text-purple-700 flex items-center justify-center text-sm font-bold">2</span>
          <i class="fa-solid fa-list-check text-purple-600"></i>
        </div>
        <div class="text-xs font-bold text-slate-900">Rekap Kloter & Petani</div>
        <div class="text-[10px] text-slate-500">Sheet: REKAP_KLOTER_CETAK</div>
      </button>

      <!-- 3. LAPORAN_NON_ERDKK -->
      <button onclick="pilihLaporan('non_erdkk')" id="tab-non_erdkk" 
              class="laporan-tab bg-white p-4 rounded-xl border-2 border-slate-200 hover:border-slate-300 shadow-sm text-left transition group">
        <div class="flex items-center justify-between mb-1">
          <span class="w-8 h-8 rounded-lg bg-blue-50 text-blue-700 flex items-center justify-center text-sm font-bold">3</span>
          <i class="fa-solid fa-users-gear text-blue-600"></i>
        </div>
        <div class="text-xs font-bold text-slate-900">Petani Non-eRDKK</div>
        <div class="text-[10px] text-slate-500">Sheet: LAPORAN_NON_ERDKK</div>
      </button>

      <!-- 4. LAPORAN_TARGET_SISA -->
      <button onclick="pilihLaporan('target_sisa')" id="tab-target_sisa" 
              class="laporan-tab bg-white p-4 rounded-xl border-2 border-slate-200 hover:border-slate-300 shadow-sm text-left transition group">
        <div class="flex items-center justify-between mb-1">
          <span class="w-8 h-8 rounded-lg bg-amber-50 text-amber-700 flex items-center justify-center text-sm font-bold">4</span>
          <i class="fa-solid fa-boxes-stacked text-amber-600"></i>
        </div>
        <div class="text-xs font-bold text-slate-900">Target Sisa Pupuk</div>
        <div class="text-[10px] text-slate-500">Sheet: LAPORAN_TARGET_SISA</div>
      </button>
    </div>
  </div>


  <!-- CONTAINER PRINT LEMBAR KERJA RESMI (diisi otomatis dari Google Sheets) -->
  <div class="max-w-6xl mx-auto">
    <div id="sync-error" class="hidden no-print mb-4 p-4 rounded-xl border border-rose-200 bg-rose-50 text-rose-800 text-xs flex items-center justify-between gap-3">
      <span><i class="fa-solid fa-triangle-exclamation mr-1"></i> <span id="sync-error-text">Gagal mengambil data dari Google Sheets.</span></span>
      <button onclick="sinkronUlangData()" class="px-3 py-1.5 rounded-lg bg-rose-600 text-white font-bold">Coba Lagi</button>
    </div>
    <div id="doc-laporan_cetak" class="print-page bg-white p-8 sm:p-12 rounded-2xl border border-slate-200 shadow-md space-y-6"></div>
    <div id="doc-rekap_kloter" class="hidden print-page bg-white p-8 sm:p-12 rounded-2xl border border-slate-200 shadow-md space-y-6"></div>
    <div id="doc-non_erdkk" class="hidden print-page bg-white p-8 sm:p-12 rounded-2xl border border-slate-200 shadow-md space-y-6"></div>
    <div id="doc-target_sisa" class="hidden print-page bg-white p-8 sm:p-12 rounded-2xl border border-slate-200 shadow-md space-y-6"></div>
  </div>

  <script>
    /* ======================================================================
     * Semua isi laporan dibaca LANGSUNG dari Google Sheets setiap halaman
     * dibuka / tombol "Segarkan Data" ditekan. Tidak ada angka yang ditulis
     * mati di HTML, sehingga perubahan di spreadsheet otomatis tampil di web.
     * ====================================================================== */
    const SHEET_ID = '1c7R1klPcFSZ7W1PLaZyayZxBUOrVyLh-Lwc24Cf6CEY';
    const DOCS = ['laporan_cetak', 'rekap_kloter', 'non_erdkk', 'target_sisa'];
    const LOADING_HTML = '<div class="py-24 text-center text-slate-500 text-sm"><i class="fa-solid fa-spinner fa-spin text-2xl text-emerald-600 mb-3 block"></i>Mengambil data terbaru dari Google Sheets...</div>';

    function pilihLaporan(id) {
      DOCS.forEach(docId => {
        const el = document.getElementById('doc-' + docId);
        const tab = document.getElementById('tab-' + docId);
        if (el) el.classList.add('hidden');
        if (tab) { tab.classList.remove('border-emerald-600', 'active-tab'); tab.classList.add('border-slate-200'); }
      });
      const targetDoc = document.getElementById('doc-' + id);
      const targetTab = document.getElementById('tab-' + id);
      if (targetDoc) targetDoc.classList.remove('hidden');
      if (targetTab) { targetTab.classList.remove('border-slate-200'); targetTab.classList.add('border-emerald-600', 'active-tab'); }
      if (history.replaceState) history.replaceState(null, '', '#' + id);
    }

    // ---------- Pengambilan data (JSONP GViz, bebas masalah CORS) ----------
    function muatSheet(name) {
      return new Promise((resolve, reject) => {
        const cb = '__gviz_' + name.replace(/\W/g, '') + '_' + Date.now();
        const s = document.createElement('script');
        const timer = setTimeout(() => { done(); reject(new Error('Waktu habis memuat ' + name)); }, 25000);
        function done() { clearTimeout(timer); try { delete window[cb]; } catch (e) { window[cb] = undefined; } s.remove(); }
        window[cb] = resp => {
          done();
          if (!resp || resp.status === 'error' || !resp.table) return reject(new Error('Sheet ' + name + ' tidak dapat dibaca'));
          resolve(resp.table.rows.map(r => (r.c || []).map(c => {
            if (!c) return { v: null, t: '' };
            const t = c.f != null ? String(c.f) : (c.v == null ? '' : String(c.v));
            return { v: c.v, t: t.replace(/\s+/g, ' ').trim() };
          })));
        };
        s.onerror = () => { done(); reject(new Error('Gagal memuat ' + name)); };
        s.src = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:json;responseHandler:' + cb +
                '&sheet=' + encodeURIComponent(name) + '&_=' + Date.now();
        document.head.appendChild(s);
      });
    }

    // ---------- Helper ----------
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    const T = (row, i) => (row && row[i] ? row[i].t : '');
    const V = (row, i) => (row && row[i] ? row[i].v : null);
    const num = x => typeof x === 'number' ? x : (parseFloat(String(x || '').replace(/[^\d,.-]/g, '').replace(/\./g, '').replace(',', '.')) || 0);
    const rupiah = n => 'Rp ' + Math.round(n).toLocaleString('id-ID');
    const kosong = row => !row || row.every(c => !c || c.t === '');
    const isSection = t => /^(I|II|III|IV|V|VI)\.\s/.test(t);
    const idxLabel = (rows, prefix, from = 0) => {
      const p = prefix.toUpperCase();
      for (let i = from; i < rows.length; i++) if (T(rows[i], 1).toUpperCase().startsWith(p)) return i;
      return -1;
    };
    // Baris data sebuah section: mulai setelah baris judul kolom, berhenti di section berikut / tanda tangan
    function barisSection(rows, judul) {
      const i = idxLabel(rows, judul);
      if (i < 0) return [];
      const out = [];
      for (let k = i + 2; k < rows.length; k++) {
        const t = T(rows[k], 1);
        if (isSection(t) || /^Mengetahui/i.test(t)) break;
        if (!kosong(rows[k])) out.push(rows[k]);
      }
      return out;
    }
    function cariTanggal(...sheets) {
      for (const rows of sheets) for (const r of rows) for (const c of r) if (c && /^Kediren,\s/.test(c.t)) return c.t;
      return 'Kediren, ' + new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    const TD = 'border border-slate-400 p-2';
    const TH = 'border border-slate-400 p-2';
    const kop = judul => `
      <div class="text-center border-b-2 border-slate-900 pb-4">
        <h2 class="text-lg font-black tracking-wider uppercase text-slate-900">KELOMPOK TANI &ldquo;SRI MULYO&rdquo;</h2>
        <p class="text-xs font-bold tracking-widest uppercase text-slate-700">DESA KEDIREN, KECAMATAN LEMBEYAN, KABUPATEN MAGETAN</p>
        <h3 class="text-sm font-extrabold uppercase mt-2 text-slate-900 underline underline-offset-4">${judul}</h3>
      </div>`;
    const kartu = (items, bg) => `
      <div class="grid gap-2 text-center border border-slate-900 p-2.5 ${bg}" style="grid-template-columns:repeat(${items.length},minmax(0,1fr))">
        ${items.map((it, i) => `<div class="${i < items.length - 1 ? 'border-r border-slate-300' : ''}">
          <div class="text-[10px] font-bold uppercase text-slate-600">${esc(it[0])}</div>
          <div class="text-base font-black ${it[3] || 'text-slate-900'} mt-0.5">${esc(it[1])}</div>
          <div class="text-[9px] text-slate-500">${esc(it[2] || '')}</div></div>`).join('')}
      </div>`;
    const ttd = (tanggal, kolom) => `
      <div class="pt-8 grid text-center text-xs" style="grid-template-columns:repeat(${kolom.length},minmax(0,1fr))">
        ${kolom.map((k, i) => `<div>
          <p>${i === 0 ? 'Mengetahui,' : (i === kolom.length - 1 ? esc(tanggal) : '&nbsp;')}</p>
          <p class="font-bold mt-1">${esc(k[0])}</p><p class="text-[10px] text-slate-500">${esc(k[1])}</p>
          <div class="h-20"></div>
          <p class="font-bold underline underline-offset-2">${esc(k[2])}</p><p class="text-[10px] text-slate-500 mt-0.5">${esc(k[3])}</p></div>`).join('')}
      </div>`;
    const TTD_PPL = ['Penyuluh Pertanian Lapangan (PPL)', 'PPL Wilbin Desa Kediren', '( ........................................ )', 'NIP. ....................................'];
    const TTD_KETUA = ['Ketua Kelompok Tani', 'Poktan "SRI MULYO"', '( SAMSI )', 'Ketua Poktan Sri Mulyo'];
    const TTD_BENDAHARA = ['Bendahara Kelompok Tani', 'Poktan "SRI MULYO"', '( SUTIKNO )', 'Bendahara Poktan'];
    const TTD_KUASA = ['Penerima Kuasa / Pengelola', 'Pengurus Kelompok Tani "SRI MULYO"', '( SUPRIYANTO )', 'Penerima Kuasa Kloter 1-10'];
    const isTotalRow = t => t && !/^\d/.test(t) && t === t.toUpperCase();

    // ---------- Ringkasan Non e-RDKK dihitung dari daftar petani ----------
    function hitungNonErdkk(rows) {
      const h = rows.findIndex(r => T(r, 2) === 'Nama Petani');
      const petani = [];
      let total = null;
      for (let k = h + 1; k < rows.length; k++) {
        const r = rows[k];
        if (/^\d+$/.test(T(r, 1)) && T(r, 2)) petani.push(r);
        else if (petani.length && !T(r, 1) && (T(r, 5) || T(r, 6))) { total = r; break; }
      }
      const bayar = petani.filter(r => num(V(r, 7)) > 0);
      // Ikuti hasil rumus spreadsheet ("6 Petani Sudah Ambil • 11 Petani Belum Ambil") bila tersedia
      const mAmbil = total ? T(total, 8).match(/(\d+)\s*Petani\s*Sudah\s*Ambil/i) : null;
      const ambil = mAmbil ? { length: parseInt(mAmbil[1], 10) } : petani.filter(r => /SDH|SUDAH/i.test(T(r, 8)));
      return {
        petani, total,
        jumlah: petani.length,
        jumlahBayar: bayar.length,
        totalBayar: bayar.reduce((a, r) => a + num(V(r, 7)), 0),
        jumlahAmbil: ambil.length,
        luas: total ? T(total, 5) : petani.reduce((a, r) => a + num(V(r, 5)), 0).toFixed(2).replace('.', ','),
        alokasi: total ? T(total, 6) : '-'
      };
    }

    // ---------- DOKUMEN 1: LAPORAN_CETAK ----------
    function renderLaporanCetak(rows, ne, tanggal) {
      const c0 = rows[0] || [], c1 = rows[1] || [];
      const fisik = barisSection(rows, 'I. REALISASI');
      const keu = barisSection(rows, 'II. REKAPITULASI');
      const adm = barisSection(rows, 'III. STATUS');
      const non = barisSection(rows, 'IV. RINGKASAN');
      const tglPendek = tanggal.replace(/^Kediren,\s*/, '');
      const kemasan = n => /organik|petro/i.test(n) ? '40 Kg' : '50 Kg';

      // Bagian IV: baris jumlah petani & setoran dihitung ulang dari LAPORAN_NON_ERDKK agar selalu sesuai
      const nonRows = non.map(r => {
        const label = T(r, 1);
        let ket = T(r, 4), nilai = T(r, 5);
        if (/^1\./.test(label)) { ket = ne.jumlah + ' Petani'; nilai = nilai || (ne.luas + ' Ha'); }
        if (/^3\./.test(label)) { ket = ne.jumlahAmbil + ' Petani Sudah Ambil • ' + (ne.jumlah - ne.jumlahAmbil) + ' Petani Belum Ambil'; nilai = ne.jumlahBayar + ' Petani Telah Bayar'; }
        if (/^TOTAL PENERIMAAN/i.test(label)) { ket = ne.jumlahBayar + ' Petani Telah Membayar'; nilai = rupiah(ne.totalBayar); }
        return [label, ket, nilai];
      });

      return `${kop('LAPORAN PERTANGGUNGJAWABAN PENYALURAN &amp; REALISASI PUPUK BERSUBSIDI')}
      <div class="grid grid-cols-2 gap-4 text-xs">
        <table class="w-full">
          <tr><td class="font-bold py-0.5 w-36">Nomor Dokumen</td><td>: 014/POKTAN-SM/KDR/XI/2026</td></tr>
          <tr><td class="font-bold py-0.5">Wilayah Binaan</td><td>: BPP Kec. Lembeyan - Magetan</td></tr>
          <tr><td class="font-bold py-0.5">Komoditas / e-RDKK</td><td>: Padi &amp; Palawija (Musim Rendeng)</td></tr>
        </table>
        <table class="w-full">
          <tr><td class="font-bold py-0.5 w-36">Musim Tanam (MT)</td><td>: MT III - 2026</td></tr>
          <tr><td class="font-bold py-0.5">Tanggal Laporan</td><td>: ${esc(tglPendek)}</td></tr>
          <tr><td class="font-bold py-0.5">Status Laporan</td><td>: Final Penyaluran Pupuk Subsidi</td></tr>
        </table>
      </div>
      ${kartu([
        ['Total Petani', T(c0, 1), T(c1, 1) || 'Petani Terdaftar'],
        ['Luas Lahan', T(c0, 2), 'Hektar Terdaftar'],
        ['Sudah Ambil', T(c0, 3) + ' Petani', 'Realisasi Ambil', 'text-emerald-800'],
        ['Sak Tersalur', T(c0, 4) + ' SAK', T(c1, 4)],
        ['Penerimaan Kas', T(c0, 5), 'Kas Hasil Penebusan', 'text-emerald-900']
      ], 'bg-emerald-50/50')}

      <div class="space-y-2">
        <h4 class="text-xs font-black uppercase text-slate-900">I. REALISASI DISTRIBUSI FISIK PUPUK BERSUBSIDI</h4>
        <table class="w-full text-xs border border-slate-900">
          <thead class="bg-slate-100 font-bold"><tr>
            <th class="${TH} text-left">Jenis Pupuk</th><th class="${TH} text-center">Kemasan</th><th class="${TH} text-right">Alokasi (Kg)</th>
            <th class="${TH} text-right">Kuota Kios (Sak)</th><th class="${TH} text-right">Realisasi (Sak)</th><th class="${TH} text-right">% Realisasi</th></tr></thead>
          <tbody>${fisik.map(r => { const tot = isTotalRow(T(r, 1)); return `<tr class="${tot ? 'bg-slate-100 font-bold border-t-2 border-slate-900' : ''}">
            <td class="${TD} ${tot ? 'uppercase' : 'font-semibold'}">${esc(T(r, 1))}</td><td class="${TD} text-center">${tot ? '-' : kemasan(T(r, 1))}</td>
            <td class="${TD} text-right font-mono">${esc(T(r, 3))}</td><td class="${TD} text-right font-mono">${esc(T(r, 4))}</td>
            <td class="${TD} text-right font-mono font-bold">${esc(T(r, 5))}</td><td class="${TD} text-right font-mono">${esc(T(r, 6))}</td></tr>`; }).join('')}</tbody>
        </table>
      </div>

      <div class="space-y-2">
        <h4 class="text-xs font-black uppercase text-slate-900">II. REKAPITULASI KEUANGAN &amp; OPERASIONAL DISTRIBUSI</h4>
        <table class="w-full text-xs border border-slate-900">
          <thead class="bg-slate-100 font-bold"><tr><th class="${TH} text-left">Uraian Transaksi Keuangan</th><th class="${TH} text-left">Volume / Keterangan</th><th class="${TH} text-right">Realisasi Nilai (Rp)</th></tr></thead>
          <tbody>${keu.map(r => { const tot = isTotalRow(T(r, 1)); return `<tr class="${tot ? 'bg-emerald-100/70 font-black border-t-2 border-slate-900' : ''}">
            <td class="${TD} ${tot ? 'uppercase' : ''}">${esc(T(r, 1))}</td><td class="${TD}">${esc(T(r, 4))}</td><td class="${TD} text-right font-mono">${esc(T(r, 5))}</td></tr>`; }).join('')}</tbody>
        </table>
      </div>

      <div class="space-y-2">
        <h4 class="text-xs font-black uppercase text-slate-900">III. STATUS ADMINISTRASI PENGAMBILAN &amp; DOKUMEN PETANI</h4>
        <table class="w-full text-xs border border-slate-900">
          <thead class="bg-slate-100 font-bold"><tr><th class="${TH} text-left">Status Pengambilan &amp; Berkas KTP</th><th class="${TH} text-center">Petani</th><th class="${TH} text-center">%</th>
            <th class="${TH} text-right">Urea (Sak)</th><th class="${TH} text-right">NPK (Sak)</th><th class="${TH} text-right">Organik (Sak)</th></tr></thead>
          <tbody>${adm.map(r => { const tot = isTotalRow(T(r, 1)); return `<tr class="${tot ? 'bg-slate-100 font-bold border-t-2 border-slate-900' : ''}">
            <td class="${TD} ${tot ? 'uppercase' : 'font-medium'}">${esc(T(r, 1))}</td><td class="${TD} text-center font-bold">${esc(T(r, 2))}</td><td class="${TD} text-center font-mono">${esc(T(r, 3))}</td>
            <td class="${TD} text-right font-mono">${esc(T(r, 4))}</td><td class="${TD} text-right font-mono">${esc(T(r, 5))}</td><td class="${TD} text-right font-mono">${esc(T(r, 6))}</td></tr>`; }).join('')}</tbody>
        </table>
      </div>

      <div class="space-y-2">
        <h4 class="text-xs font-black uppercase text-slate-900">IV. RINGKASAN PENYALURAN PUPUK NON e-RDKK (CADANGAN POKTAN)</h4>
        <table class="w-full text-xs border border-slate-900">
          <thead class="bg-slate-100 font-bold"><tr><th class="${TH} text-left">Uraian Rekapitulasi Non e-RDKK</th><th class="${TH} text-left">Volume / Keterangan</th><th class="${TH} text-right">Nilai</th></tr></thead>
          <tbody>${nonRows.map(r => { const tot = isTotalRow(r[0]); return `<tr class="${tot ? 'bg-emerald-100/70 font-black border-t-2 border-slate-900' : ''}">
            <td class="${TD} ${tot ? 'uppercase' : ''}">${esc(r[0])}</td><td class="${TD}">${esc(r[1])}</td><td class="${TD} text-right font-mono">${esc(r[2])}</td></tr>`; }).join('')}</tbody>
        </table>
      </div>
      ${ttd(tanggal, [TTD_PPL, TTD_KETUA, TTD_BENDAHARA])}`;
    }

    // ---------- DOKUMEN 2: REKAP_KLOTER_CETAK ----------
    function renderRekapKloter(rows, tanggal) {
      const c0 = rows[0] || [], c1 = rows[1] || [];
      const kloter = rows.filter(r => /^Kloter\s*\d+/i.test(T(r, 2)));
      const lastK = rows.lastIndexOf(kloter[kloter.length - 1]);
      const totK = rows.slice(lastK + 1).find(r => T(r, 5) && !T(r, 2)) || [];
      const iJenis = rows.findIndex(r => T(r, 2) === 'Jenis Pupuk');
      const drop = [], dropExtra = [];
      let dropTot = null;
      if (iJenis >= 0) for (let k = iJenis + 1; k < rows.length; k++) {
        const r = rows[k];
        if (T(r, 2) === 'NIK') break;
        if (/^\d+$/.test(T(r, 1)) && T(r, 2)) drop.push(r);
        else if (T(r, 3)) dropTot = r;
        else if (T(r, 8)) dropExtra.push(T(r, 8));
      }
      const iNik = rows.findIndex(r => T(r, 2) === 'NIK');
      const petani = [];
      let totP = null;
      if (iNik >= 0) for (let k = iNik + 1; k < rows.length; k++) {
        const r = rows[k];
        if (/^\d+$/.test(T(r, 1)) && T(r, 3)) petani.push(r);
        else if (petani.length && T(r, 6)) { totP = r; break; }
        else if (petani.length && kosong(r)) break;
      }
      return `${kop('REKAPITULASI PENYALURAN PUPUK SUBSIDI &amp; STATUS KLOTER PENEBUSAN')}
      ${kartu([
        ['Total Petani', T(c0, 1), 'Petani Terdaftar e-RDKK'],
        ['Petani Masuk Kloter', T(c0, 3), T(c1, 3), 'text-purple-800'],
        ['Penebusan Mandiri', T(c0, 5), T(c1, 5), 'text-amber-800'],
        ['Total Bobot Pupuk', T(c0, 7) + ' Kg', 'Urea + NPK + Organik']
      ], 'bg-purple-50/50')}

      <div class="no-print p-3.5 bg-purple-50 border border-purple-200 rounded-xl flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-xs">
        <div class="flex items-center gap-2 text-purple-900 font-medium">
          <i class="fa-solid fa-file-contract text-purple-700 text-base"></i>
          <span>Perlu mencetak lembar <b>Surat Kuasa Resmi per Kloter (1 s/d 10)</b> lengkap dengan kolom zig-zag tanda tangan format kertas F4 / Folio?</span>
        </div>
        <a href="cetak-kloter.html" class="px-3.5 py-1.5 rounded-lg bg-purple-700 hover:bg-purple-800 text-white font-bold whitespace-nowrap transition text-center shadow-sm">
          Buka Format F4 Kloter 1-10
        </a>
      </div>

      <div class="space-y-2">
        <h4 class="text-xs font-black uppercase text-slate-900">I. DAFTAR KLOTER SURAT KUASA PENEBUSAN (KLOTER 1 S/D ${kloter.length})</h4>
        <table class="w-full text-xs border border-slate-900">
          <thead class="bg-slate-100 font-bold"><tr><th class="${TH} text-center w-10">No</th><th class="${TH} text-left">Nama Kloter</th><th class="${TH} text-left">Pemberi Kuasa (Perwakilan)</th>
            <th class="${TH} text-left">Penerima Kuasa</th><th class="${TH} text-center">Jumlah Petani</th><th class="${TH} text-right">Urea (Kg)</th><th class="${TH} text-right">NPK (Kg)</th><th class="${TH} text-right">Organik (Kg)</th></tr></thead>
          <tbody>${kloter.map(r => `<tr><td class="${TD} text-center">${esc(T(r, 1))}</td><td class="${TD} font-bold">${esc(T(r, 2))}</td><td class="${TD}">${esc(T(r, 3))}</td><td class="${TD}">${esc(T(r, 4))}</td>
            <td class="${TD} text-center font-bold">${esc(T(r, 5))}</td><td class="${TD} text-right font-mono">${esc(T(r, 6))}</td><td class="${TD} text-right font-mono">${esc(T(r, 7))}</td><td class="${TD} text-right font-mono">${esc(T(r, 8))}</td></tr>`).join('')}
            <tr class="bg-slate-100 font-bold border-t-2 border-slate-900"><td colspan="4" class="${TD} uppercase">TOTAL ALOKASI DALAM KLOTER</td><td class="${TD} text-center text-purple-900">${esc(T(totK, 5))} Petani</td>
            <td class="${TD} text-right font-mono">${esc(T(totK, 6))}</td><td class="${TD} text-right font-mono">${esc(T(totK, 7))}</td><td class="${TD} text-right font-mono">${esc(T(totK, 8))}</td></tr></tbody>
        </table>
      </div>

      <div class="space-y-2">
        <h4 class="text-xs font-black uppercase text-slate-900">II. STATUS DROP PENGIRIMAN GUDANG POKTAN &amp; REKAP TAGIHAN KIOS</h4>
        <table class="w-full text-xs border border-slate-900">
          <thead class="bg-slate-100 font-bold"><tr><th class="${TH} text-center w-10">No</th><th class="${TH} text-left">Jenis Pupuk</th><th class="${TH} text-right">Alokasi Surat Kuasa BPP</th>
            <th class="${TH} text-right">Sudah Dikirim Ke Gudang</th><th class="${TH} text-right">Belum Dikirim Ke Gudang</th><th class="${TH} text-right">Harga / Sak</th><th class="${TH} text-right">Nilai Tagihan</th></tr></thead>
          <tbody>${drop.map(r => `<tr><td class="${TD} text-center">${esc(T(r, 1))}</td><td class="${TD} font-semibold">${esc(T(r, 2))}</td><td class="${TD} text-right font-mono">${esc(T(r, 3))}</td>
            <td class="${TD} text-right font-mono font-bold text-emerald-800">${esc(T(r, 4))}</td><td class="${TD} text-right font-mono text-amber-700">${esc(T(r, 5))}</td>
            <td class="${TD} text-right font-mono">${esc(T(r, 7))}</td><td class="${TD} text-right font-mono font-bold">${esc(T(r, 8))}</td></tr>`).join('')}
            ${dropTot ? `<tr class="bg-slate-100 font-bold border-t-2 border-slate-900"><td colspan="2" class="${TD} uppercase">TOTAL</td><td class="${TD} text-right font-mono">${esc(T(dropTot, 3))}</td>
              <td class="${TD} text-right font-mono">${esc(T(dropTot, 4))}</td><td class="${TD} text-right font-mono">${esc(T(dropTot, 5))}</td><td class="${TD}"></td><td class="${TD} text-right font-mono">${esc(T(dropTot, 8))}</td></tr>` : ''}
            ${dropExtra[0] ? `<tr class="bg-emerald-50 font-bold"><td colspan="6" class="${TD} text-right uppercase">Setoran / Pembayaran ke Kios</td><td class="${TD} text-right font-mono text-emerald-800">${esc(dropExtra[0])}</td></tr>` : ''}
            ${dropExtra[1] ? `<tr class="bg-amber-50 font-bold"><td colspan="6" class="${TD} text-right uppercase">Sisa Tagihan</td><td class="${TD} text-right font-mono text-amber-900">${esc(dropExtra[1])}</td></tr>` : ''}
          </tbody>
        </table>
      </div>

      <div class="space-y-2 pt-4">
        <h4 class="text-xs font-black uppercase text-slate-900">III. DAFTAR LENGKAP STATUS PETANI &amp; PENERIMA KUASA (${petani.length} ANGGOTA e-RDKK)</h4>
        <table class="w-full text-[11px] border border-slate-900">
          <thead class="bg-slate-100 font-bold"><tr><th class="border border-slate-400 p-1.5 text-center w-10">No</th><th class="border border-slate-400 p-1.5 text-center">NIK</th><th class="border border-slate-400 p-1.5 text-left">Nama Petani</th>
            <th class="border border-slate-400 p-1.5 text-center">Status</th><th class="border border-slate-400 p-1.5 text-left">Penerima Kuasa</th><th class="border border-slate-400 p-1.5 text-right">Urea (Kg)</th>
            <th class="border border-slate-400 p-1.5 text-right">NPK (Kg)</th><th class="border border-slate-400 p-1.5 text-right">Org (Kg)</th></tr></thead>
          <tbody>${petani.map(r => `<tr><td class="border border-slate-400 p-1 text-center font-mono">${esc(T(r, 1))}</td><td class="border border-slate-400 p-1 text-center font-mono text-[10px] text-slate-600">${esc(T(r, 2))}</td>
            <td class="border border-slate-400 p-1 font-bold">${esc(T(r, 3))}</td>
            <td class="border border-slate-400 p-1 text-center"><span class="px-1.5 py-0.5 rounded text-[9px] font-bold ${/kloter/i.test(T(r, 4)) ? 'bg-purple-100 text-purple-800' : 'bg-slate-100 text-slate-600'}">${esc(T(r, 4))}</span></td>
            <td class="border border-slate-400 p-1">${esc(T(r, 5))}</td><td class="border border-slate-400 p-1 text-right font-mono">${esc(T(r, 6))}</td>
            <td class="border border-slate-400 p-1 text-right font-mono">${esc(T(r, 7))}</td><td class="border border-slate-400 p-1 text-right font-mono">${esc(T(r, 8))}</td></tr>`).join('')}
            ${totP ? `<tr class="bg-slate-100 font-black border-t-2 border-slate-900"><td colspan="5" class="${TD} uppercase text-right">TOTAL ${petani.length} ANGGOTA e-RDKK:</td>
              <td class="${TD} text-right font-mono">${esc(T(totP, 6))}</td><td class="${TD} text-right font-mono">${esc(T(totP, 7))}</td><td class="${TD} text-right font-mono">${esc(T(totP, 8))}</td></tr>` : ''}
          </tbody>
        </table>
      </div>
      ${ttd(tanggal, [TTD_KETUA, TTD_KUASA])}`;
    }

    // ---------- DOKUMEN 3: LAPORAN_NON_ERDKK ----------
    function renderNonErdkk(ne, tanggal) {
      return `${kop('LAPORAN ALOKASI &amp; PENYALURAN PUPUK CADANGAN POKTAN (NON-eRDKK)')}
      ${kartu([
        ['Total Petani Non-eRDKK', ne.jumlah + ' Petani', 'Daftar Usulan Cadangan'],
        ['Total Luas Lahan', ne.luas + ' Ha', 'Lahan Garapan Petani'],
        ['Total Alokasi Sak', ne.alokasi, 'Urea • NPK • Organik', 'text-blue-900'],
        ['Kas Masuk Terbayar', rupiah(ne.totalBayar), ne.jumlahBayar + ' Petani Telah Bayar', 'text-emerald-900']
      ], 'bg-blue-50/50')}
      <div class="space-y-2">
        <h4 class="text-xs font-black uppercase text-slate-900">DAFTAR LENGKAP PETANI NON-eRDKK &amp; ALOKASI PUPUK CADANGAN (${ne.jumlah} PETANI)</h4>
        <table class="w-full text-xs border border-slate-900">
          <thead class="bg-slate-100 font-bold"><tr><th class="${TH} text-center w-10">No</th><th class="${TH} text-left">Nama Petani</th><th class="${TH} text-left">Alamat / Blok Lahan</th>
            <th class="${TH} text-left">Status Usulan</th><th class="${TH} text-center">Luas (Ha)</th><th class="${TH} text-center">Alokasi (U/P/O)</th><th class="${TH} text-right">Setoran (Rp)</th><th class="${TH} text-left">Keterangan</th></tr></thead>
          <tbody>${ne.petani.map(r => { const bayar = num(V(r, 7)) > 0; const ambil = /SDH|SUDAH/i.test(T(r, 8)); return `<tr>
            <td class="${TD} text-center font-mono">${esc(T(r, 1))}</td><td class="${TD} font-bold">${esc(T(r, 2))}</td><td class="${TD}">${esc(T(r, 3))}</td>
            <td class="${TD} text-[11px] text-slate-600">${esc(T(r, 4))}</td><td class="${TD} text-center font-mono">${esc(T(r, 5))}</td>
            <td class="${TD} text-center font-bold text-blue-900 font-mono">${esc(T(r, 6))}</td>
            <td class="${TD} text-right font-mono ${bayar ? 'font-bold text-emerald-800' : 'text-slate-500'}">${bayar ? rupiah(num(V(r, 7))) : '-'}</td>
            <td class="${TD} text-[10px]"><span class="px-1.5 py-0.5 rounded font-bold ${ambil ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-600'}">${esc(T(r, 8))}</span></td></tr>`; }).join('')}
            <tr class="bg-slate-100 font-black border-t-2 border-slate-900"><td colspan="4" class="${TD} uppercase text-right">TOTAL (${ne.jumlah} PETANI):</td>
              <td class="${TD} text-center font-mono">${esc(ne.luas)}</td><td class="${TD} text-center font-mono text-blue-900">${esc(ne.alokasi)}</td>
              <td class="${TD} text-right font-mono text-emerald-900">${rupiah(ne.totalBayar)}</td>
              <td class="${TD} text-[10px]">${ne.jumlahBayar} Bayar • ${ne.jumlahAmbil} Sudah Ambil • ${ne.jumlah - ne.jumlahAmbil} Belum</td></tr>
          </tbody>
        </table>
      </div>
      ${ttd(tanggal, [TTD_KETUA, TTD_KUASA])}`;
    }

    // ---------- DOKUMEN 4: LAPORAN_TARGET_SISA ----------
    function renderTargetSisa(rows, tanggal) {
      const c0 = rows[0] || [], c1 = rows[1] || [];
      const sec = (judul, headKet) => {
        const i = idxLabel(rows, judul);
        const data = barisSection(rows, judul);
        return `<div class="space-y-2">
          <h4 class="text-xs font-black uppercase text-slate-900">${esc(i >= 0 ? T(rows[i], 1) : judul)}</h4>
          <table class="w-full text-xs border border-slate-900">
            <thead class="bg-slate-100 font-bold"><tr><th class="${TH} text-left">${esc(i >= 0 ? T(rows[i + 1], 1) : 'Komponen')}</th><th class="${TH} text-center w-16">Satuan</th>
              <th class="${TH} text-right">Urea</th><th class="${TH} text-right">NPK Phonska</th><th class="${TH} text-right">Organik</th><th class="${TH} text-right">Total</th><th class="${TH} text-left">${esc(i >= 0 ? T(rows[i + 1], 7) : headKet)}</th></tr></thead>
            <tbody>${data.map(r => { const tot = isTotalRow(T(r, 1)); return `<tr class="${tot ? 'bg-amber-100/60 font-bold border-t-2 border-slate-900' : ''}">
              <td class="${TD} ${tot ? 'uppercase' : ''}">${esc(T(r, 1))}</td><td class="${TD} text-center">${esc(T(r, 2))}</td>
              <td class="${TD} text-right font-mono">${esc(T(r, 3))}</td><td class="${TD} text-right font-mono">${esc(T(r, 4))}</td><td class="${TD} text-right font-mono">${esc(T(r, 5))}</td>
              <td class="${TD} text-right font-mono font-bold">${esc(T(r, 6))}</td><td class="${TD} text-slate-600">${esc(T(r, 7))}</td></tr>`; }).join('')}</tbody>
          </table></div>`;
      };
      return `${kop('LAPORAN TARGET SISA PUPUK PENGAJUAN PPL &amp; HASIL PEMBAGIAN')}
      ${kartu([
        ['Total Target Sisa', T(c0, 1), T(c1, 1) || 'Pengajuan + Pembagian', 'text-amber-900'],
        ['Target Sisa Pengajuan PPL', T(c0, 3), 'Selisih Pengajuan vs Kios'],
        ['Sisa Hasil Pembagian', T(c0, 5), 'Sisa Kuota - Non eRDKK'],
        ['Cadangan Non-eRDKK', T(c0, 7), T(c1, 7), 'text-blue-900']
      ], 'bg-amber-50/50')}
      <div class="space-y-5">${sec('I. ANALISIS', 'Keterangan')}${sec('II. REALISASI', 'Keterangan')}${sec('III. REKAPITULASI', 'Formula')}</div>
      ${ttd(tanggal, [TTD_PPL, TTD_KETUA, TTD_BENDAHARA])}`;
    }

    // ---------- Sinkronisasi ----------
    let sedangSinkron = false;
    async function sinkronUlangData() {
      if (sedangSinkron) return;
      sedangSinkron = true;
      const btn = document.getElementById('btn-refresh');
      const badge = document.getElementById('sync-badge');
      const errBox = document.getElementById('sync-error');
      if (btn) btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-emerald-600"></i> Memperbarui...';
      DOCS.forEach(d => { const el = document.getElementById('doc-' + d); if (el && !el.dataset.loaded) el.innerHTML = LOADING_HTML; });
      try {
        const [cetak, kloter, non, sisa] = await Promise.all(['LAPORAN_CETAK', 'REKAP_KLOTER_CETAK', 'LAPORAN_NON_ERDKK', 'LAPORAN_TARGET_SISA'].map(muatSheet));
        const tanggal = cariTanggal(non, kloter, cetak, sisa);
        const ne = hitungNonErdkk(non);
        const set = (id, html) => { const el = document.getElementById('doc-' + id); el.innerHTML = html; el.dataset.loaded = '1'; };
        set('laporan_cetak', renderLaporanCetak(cetak, ne, tanggal));
        set('rekap_kloter', renderRekapKloter(kloter, tanggal));
        set('non_erdkk', renderNonErdkk(ne, tanggal));
        set('target_sisa', renderTargetSisa(sisa, tanggal));
        errBox.classList.add('hidden');
        const jam = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        if (badge) badge.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-600"></i> Sinkron Google Sheets • ' + jam;
      } catch (err) {
        console.error(err);
        document.getElementById('sync-error-text').textContent = 'Gagal mengambil data dari Google Sheets (' + err.message + '). Periksa koneksi internet lalu coba lagi.';
        errBox.classList.remove('hidden');
        DOCS.forEach(d => { const el = document.getElementById('doc-' + d); if (el && !el.dataset.loaded) el.innerHTML = '<div class="py-16 text-center text-slate-400 text-sm">Data belum dapat dimuat.</div>'; });
        if (badge) badge.innerHTML = '<i class="fa-solid fa-circle-xmark text-rose-600"></i> Gagal sinkron';
      } finally {
        sedangSinkron = false;
        if (btn) btn.innerHTML = '<i class="fa-solid fa-rotate text-emerald-600"></i> Segarkan Data';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const hash = window.location.hash.replace('#', '');
      if (DOCS.includes(hash)) pilihLaporan(hash);
      sinkronUlangData();
    });
    // Saat pengguna kembali ke tab ini (mis. habis mengedit spreadsheet), data otomatis diperbarui
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sinkronUlangData(); });
  </script>

</body>
</html>
